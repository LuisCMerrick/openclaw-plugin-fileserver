<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Status}} - {{.Title}}</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-danger: #f85149;
            --accent-warn: #d29922;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .status-badge {
            display: inline-block;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--accent-danger);
            color: var(--accent-danger);
            background: rgba(248, 81, 73, 0.1);
        }
        h1 { font-size: 24px; margin-bottom: 12px; color: #f0f6fc; }
        p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; }
        .footer { font-size: 12px; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge">HTTP {{.Status}}</div>
        <h1>{{.Title}}</h1>
        <p>{{.Message}}</p>
        <div class="footer">OpenClaw Secure File Transport</div>
    </div>
</body>
</html>
